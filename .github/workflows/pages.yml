name: Deploy webapp to GitHub Pages

# SPEC-R2-WORKSHOP-ACCESS §5.2 — off-network viewer path.
#
# The dashboard's invite envelope sets
#   url_relay = https://reality2-ai.github.io/r2-workshop/?join=…&relay=…
# so a QR-scanned phone with only cellular internet loads the webapp
# from this host, opens a WSS to the configured relay, and runs the
# JSON access.request/access.response pairing handshake.
#
# The WASM bundle under `webapp/pkg/` is gitignored (binary artifact),
# so this workflow builds it from source via `wasm-pack` before
# uploading the artifact. A push that only touches HTML/JS in
# `webapp/` triggers a rebuild too — the bundle's source lives at
# `crates/r2-wasm/` and changes there also need to roll out.
#
# Pages must be set to "GitHub Actions" as the source under
# repo Settings → Pages before the first deploy will publish.

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - "crates/r2-wasm/**"
      - "crates/r2-fnv/**"
      - "crates/r2-cbor/**"
      - "crates/r2-wire/**"
      - "crates/r2-core/**"
      - "crates/r2-trust/**"
      - "crates/r2-route/**"
      - "crates/r2-transport/**"
      - "crates/r2-engine/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock', 'crates/r2-wasm/Cargo.toml') }}

      - name: Build WASM bundle into webapp/pkg/
        run: |
          wasm-pack build crates/r2-wasm --target web --release --out-dir ../../webapp/pkg
          ls -la webapp/pkg/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload webapp/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
