[package]
name = "r2-esp"
version = "0.1.0"
edition = "2021"
description = "Shared ESP-IDF modules for R2 firmware — OTA, WiFi, provisioning, identity, BLE L2CAP"

[dependencies]
# R2 protocol crates (no_std compatible)
r2-core = { path = "../r2-core", features = ["alloc"] }
r2-wire = { path = "../../../r2-core/crates/r2-wire", features = ["alloc"] }
# TRUE TN: routing engine + transport seam (docs/tn-routeengine-smallest-path.md)
r2-route = { path = "../../../r2-core/crates/r2-route" }
r2-transport = { path = "../../../r2-core/crates/r2-transport", features = ["alloc"] }
# TN node driver + the pure-std UDP transport (host-tested in r2-tn; the firmware
# re-exports it as peer_wifi_udp::WifiUdpTransport).
r2-tn = { path = "../r2-tn" }
# Shared, PV1-locked persona parser (TG provisioning) — persona_flash calls it.
r2-trust = { path = "../r2-trust" }
# Canonical transient-mesh crate (PATH-DEP, not vendored — interop-critical, core's
# call): beacon codec (r2_discovery::beacon) + #24 negotiation engine + the shared
# ControlMsg codec + NegotiationRadio trait. no-alloc tier (beacon + negotiation are
# un-gated; std peer_table is excluded). Zero-drift vs hive's esp-radio side.
r2-discovery = { path = "../../../r2-core/crates/r2-discovery", default-features = false }

# ESP-IDF framework
esp-idf-svc = { version = "0.51", features = ["binstart"] }

# BLE (optional — only needed for L2CAP provisioning)
esp32-nimble = { version = "0.11", optional = true }

# Crypto: SHA-2 for OTA + R2-WIRE §6.2.1 hive_id derivation;
# HMAC + HKDF for the §6.2.1 derivation itself.
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }

# Logging + errors
log = "0.4"
anyhow = "1"

[features]
default = ["ble"]
ble = ["dep:esp32-nimble"]
# TRUE TN run-loop (crate::tn). Off by default; a TN board enables it.
tn = []
# #24 esp-idf NegotiationRadio (Profile-A). Pair with `ble` for the L2CAP
# control-plane path; the engine + ControlMsg codec come from r2-discovery.
negotiation = ["ble"]
